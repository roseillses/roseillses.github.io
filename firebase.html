<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Cute GitHub Login</title>
  <style>
    body {
      background-color: #ffe5ec; /* Нежно-розовый фон */
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      position: relative;
    }
    .card {
      background: rgba(255, 255, 255, 0.9);
      padding: 40px;
      border-radius: 30px;
      box-shadow: 0 10px 25px rgba(255, 182, 193, 0.5);
      text-align: center;
      z-index: 10;
      border: 3px solid #ffb3c1;
    }
    h2 {
      color: #ff4d6d;
      margin-bottom: 20px;
    }
    button {
      background-color: #ffffff;
      border: 2px solid #ffb3c1;
      color: #ff4d6d;
      padding: 12px 28px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      margin: 10px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    button:hover {
      transform: scale(1.08);
      box-shadow: 0 6px 15px rgba(255, 77, 109, 0.3);
      background-color: #fff0f3;
    }
    /* Стили для летающих сердечек */
    .heart {
      position: absolute;
      color: #ff4d6d;
      font-size: 24px;
      pointer-events: none;
      animation: floatUp 4s linear infinite;
      bottom: -50px;
    }
    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg) scale(1);
        opacity: 0.9;
      }
      100% {
        transform: translateY(-110vh) rotate(360deg) scale(1.2);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Привет! 💕</h2>
  <button id="loginBtn">Войти через GitHub ✨</button>
  <button id="logoutBtn" style="display:none;">Выйти 💖</button>
</div>

<!-- Подключаем SDK через ESM-модули -->
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
  import { getAuth, signInWithPopup, GithubAuthProvider, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';

  // Конфигурация вашего проекта
  const firebaseConfig = {
    apiKey:  "AIzaSyDRbQUs_sX9y_Oz6GI-uiRbnBbov_YTZYo", // Вставьте сюда ваш API Key
    authDomain: "fjfjf-bf120.firebaseapp.com",
    projectId: "fjfjf-bf120",
    storageBucket: "fjfjf-bf120.appspot.com",
    messagingSenderId: "313859445563",
    appId: "1:313859445563:web:1ad75f62d5da494c5ddd1e"// Вставьте сюда ваш App ID
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GithubAuthProvider();

  const loginBtn = document.getElementById('loginBtn');
  const logoutBtn = document.getElementById('logoutBtn');

  // Логика входа
  loginBtn.addEventListener('click', () => {
    signInWithPopup(auth, provider).catch(err => console.error(err));
  });

  // Логика выхода
  logoutBtn.addEventListener('click', () => {
    signOut(auth).catch(err => console.error(err));
  });

  // Отслеживание состояния пользователя
  onAuthStateChanged(auth, (user) => {
    if (user) {
      loginBtn.style.display = 'none';
      logoutBtn.style.display = 'inline-block';
    } else {
      loginBtn.style.display = 'inline-block';
      logoutBtn.style.display = 'none';
    }
  });

  // Генератор летающих сердечек
  function createHeart() {
    const heart = document.createElement('div');
    heart.classList.add('heart');
    heart.innerHTML = '❤️';
    heart.style.left = Math.random() * 100 + 'vw';
    heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
    heart.style.fontSize = (Math.random() * 15 + 12) + 'px';
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 4500);
  }
  setInterval(createHeart, 300);
</script>

</body>
</html>
