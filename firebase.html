<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Cute Login</title>
  <style>
    body {
      background-color: #ffe5ec; /* Нежно-розовый фон */
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      position: relative;
    }
    .card {
      background: rgba(255, 255, 255, 0.9);
      padding: 40px;
      border-radius: 30px;
      box-shadow: 0 10px 25px rgba(255, 182, 193, 0.5);
      text-align: center;
      z-index: 10;
      border: 3px solid #ffb3c1;
    }
    h2 {
      color: #ff4d6d;
      margin-bottom: 20px;
    }
    input {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 10px 15px;
      margin: 10px 0;
      border: 2px solid #ffb3c1;
      border-radius: 50px;
      outline: none;
      font-family: inherit;
      color: #ff4d6d;
      text-align: center;
      transition: all 0.3s ease;
    }
    input:focus {
      border-color: #ff4d6d;
      box-shadow: 0 0 8px rgba(255, 77, 109, 0.2);
    }
    button {
      background-color: #ffffff;
      border: 2px solid #ffb3c1;
      color: #ff4d6d;
      padding: 12px 28px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      margin: 10px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    button:hover {
      transform: scale(1.08);
      box-shadow: 0 6px 15px rgba(255, 77, 109, 0.3);
      background-color: #fff0f3;
    }
    .heart {
      position: absolute;
      color: #ff4d6d;
      font-size: 24px;
      pointer-events: none;
      animation: floatUp 4s linear infinite;
      bottom: -50px;
    }
    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg) scale(1);
        opacity: 0.9;
      }
      100% {
        transform: translateY(-110vh) rotate(360deg) scale(1.2);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

<div class="card">
  <h2 id="welcomeHeader">Привет! 💕</h2>
  
  <div id="emailForm">
    <input type="email" id="emailInput" placeholder="Электронная почта 📧">
    <input type="password" id="passwordInput" placeholder="Пароль 🔑">
    <div style="display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;">
      <button id="emailLoginBtn">Войти по почте 🌸</button>
      <button id="emailRegisterBtn">Создать аккаунт 🎀</button>
    </div>
  </div>

  <button id="loginBtn">Войти через GitHub ✨</button>
  <button id="googleLoginBtn">Войти через Google 🌟</button>
  <button id="logoutBtn" style="display:none;">Выйти 💖</button>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
  import { 
    getAuth, 
    signInWithPopup, 
    GithubAuthProvider, 
    GoogleAuthProvider, 
    signOut, 
    onAuthStateChanged, 
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword 
  } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';

  const firebaseConfig = {
    apiKey: "AIzaSyDRbQUs_sX9y_Oz6GI-uiRbnBbov_YTZYo",
    authDomain: "fjfjf-bf120.firebaseapp.com",
    projectId: "fjfjf-bf120",
    storageBucket: "fjfjf-bf120.appspot.com",
    messagingSenderId: "313859445563",
    appId: "1:313859445563:web:1ad75f62d5da494c5ddd1e"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  
  const githubProvider = new GithubAuthProvider();
  const googleProvider = new GoogleAuthProvider();

  const welcomeHeader = document.getElementById('welcomeHeader');
  const loginBtn = document.getElementById('loginBtn');
  const googleLoginBtn = document.getElementById('googleLoginBtn');
  const logoutBtn = document.getElementById('logoutBtn');
  
  const emailForm = document.getElementById('emailForm');
  const emailInput = document.getElementById('emailInput');
  const passwordInput = document.getElementById('passwordInput');
  const emailLoginBtn = document.getElementById('emailLoginBtn');
  const emailRegisterBtn = document.getElementById('emailRegisterBtn');

  // Регистрация нового аккаунта
  emailRegisterBtn.addEventListener('click', () => {
    const email = emailInput.value;
    const password = passwordInput.value;
    createUserWithEmailAndPassword(auth, email, password)
      .catch(err => console.error("Ошибка регистрации:", err));
  });

  // Вход по почте
  emailLoginBtn.addEventListener('click', () => {
    const email = emailInput.value;
    const password = passwordInput.value;
    signInWithEmailAndPassword(auth, email, password)
      .catch(err => console.error("Ошибка входа по почте:", err));
  });

  // Вход через GitHub/Google
  loginBtn.addEventListener('click', () => {
    signInWithPopup(auth, githubProvider).catch(err => console.error(err));
  });

  googleLoginBtn.addEventListener('click', () => {
    signInWithPopup(auth, googleProvider).catch(err => console.error(err));
  });

  // Выход из аккаунта
  logoutBtn.addEventListener('click', () => {
    signOut(auth).catch(err => console.error(err));
  });

  // Отслеживание состояния
  onAuthStateChanged(auth, (user) => {
    if (user) {
      const displayName = user.displayName || user.email || 'Друг';
      welcomeHeader.textContent = `Привет, ${displayName}! 💕`;
      emailForm.style.display = 'none';
      loginBtn.style.display = 'none';
      googleLoginBtn.style.display = 'none';
      logoutBtn.style.display = 'inline-block';
    } else {
      welcomeHeader.textContent = 'Привет! 💕';
      emailForm.style.display = 'block';
      loginBtn.style.display = 'inline-block';
      googleLoginBtn.style.display = 'inline-block';
      logoutBtn.style.display = 'none';
    }
  });

  // Анимация сердечек
  function createHeart() {
    const heart = document.createElement('div');
    heart.classList.add('heart');
    heart.innerHTML = '❤️';
    heart.style.left = Math.random() * 100 + 'vw';
    heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
    heart.style.fontSize = (Math.random() * 15 + 12) + 'px';
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 4500);
  }
  setInterval(createHeart, 300);
</script>

</body>
</html>
